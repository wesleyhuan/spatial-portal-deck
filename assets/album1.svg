<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <rect width="600" height="600" fill="#121519"/>
    <rect width="596" height="596" x="2" y="2" fill="none" stroke="rgba(239,235,228,0.12)" stroke-width="2"/>
    
    <!-- Drafting Grid -->
    <g opacity="0.15">
      <line x1="60" y1="0" x2="60" y2="600" stroke="#EFEBE4" stroke-width="1"/>
      <line x1="540" y1="0" x2="540" y2="600" stroke="#EFEBE4" stroke-width="1"/>
      <line x1="0" y1="60" x2="600" y2="60" stroke="#EFEBE4" stroke-width="1"/>
      <line x1="0" y1="540" x2="600" y2="540" stroke="#EFEBE4" stroke-width="1"/>
    </g>

    <!-- Structural Drawing Geometry -->
    <g transform="translate(300,270)">
      
    <polygon points="-120,-100 120,-100 150,110 -150,110" fill="none" stroke="#D98A38" stroke-width="2"/>
    <rect x="-80" y="-60" width="160" height="120" fill="none" stroke="rgba(239,235,228,0.2)" stroke-width="1"/>
    <line x1="-150" y1="110" x2="150" y2="-100" stroke="#34747B" stroke-width="1"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#D98A38" stroke-width="1" stroke-dasharray="6 4"/>
  
    </g>

    <!-- Header Metadata -->
    <text x="60" y="45" font-family="'Sora', sans-serif" font-weight="600" font-size="12" fill="#D98A38" letter-spacing="0.15em">MNL-001</text>
    <text x="540" y="45" text-anchor="end" font-family="'Sora', sans-serif" font-weight="500" font-size="12" fill="#A0A7AC" letter-spacing="0.15em">2024 // ARCHIVAL SPEC</text>
    <line x1="60" y1="60" x2="540" y2="60" stroke="rgba(239,235,228,0.13)" stroke-width="1"/>

    <!-- Bottom Typography -->
    <line x1="60" y1="470" x2="540" y2="470" stroke="rgba(239,235,228,0.13)" stroke-width="1"/>
    <text x="60" y="505" font-family="'Syne', sans-serif" font-weight="800" font-size="28" fill="#EFEBE4" letter-spacing="-0.02em">VILLA VACUUM</text>
    <text x="60" y="532" font-family="'Sora', sans-serif" font-weight="500" font-size="13" fill="#A0A7AC" letter-spacing="0.12em">BERLIN, GERMANY</text>
    
    <!-- Accent Dot -->
